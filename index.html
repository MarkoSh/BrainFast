  get(k, d) { try { return localStorage.getItem(k) ?? d } catch (e) { return d } },
  set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} },
  del(k) { try { localStorage.removeItem(k) } catch (e) {} },
};
const LANGS = ['ru', 'en', 'th'];
let lang = store.get('bf-lang', LANGS.find(l => (navigator.language || '').startsWith(l)) || 'en');
const t = k => T[lang][k] ?? T.en[k];
const L = o => o[lang] ?? o.en;                        // { ru, en, th } -> current language
const tri = (ru, en, th) => ({ ru, en, th });
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]);
const esc = v => String(v).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const icons = () => lucide.createIcons();
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]] } return a };
const word = w => w[{ ru: 0, en: 1, th: 2 }[lang]];
const locus = l => l[{ ru: 1, en: 2, th: 3 }[lang]];
const fmtSec = v => `${(+v).toFixed(1)} ${t('sec')}`;

/* --- statistics: per game and mode, history of { v, d } in localStorage --- */
const SK = (g, m) => `bf:${g}:${m}`;
const hist = (g, m) => { try { return JSON.parse(store.get(SK(g, m), '[]')) } catch (e) { return [] } };
const better = (G, a, b) => b == null || (G.lower ? a < b : a > b);
function bestOf(G, m) { let b = null; hist(G.id, m).forEach(h => { if (better(G, h.v, b)) b = h.v }); return b }
function record(G, m, v, e) { const h = hist(G.id, m); h.push({ v, e, d: Date.now() }); store.set(SK(G.id, m), JSON.stringify(h.slice(-300))) }
const totalPlayed = () => GAMES.reduce((n, G) => n + G.modes.reduce((k, m) => k + hist(G.id, m.k).length, 0), 0);

// result line (up = better) and, when the game counts them, an errors line (up = more errors)
function spark(G, h) {
  if (h.length < 2) return `<p class="h-14 grid place-items-center text-xs text-zinc-600">${t('playAgainChart')}</p>`;
  const line = (vals, color) => {
    const lo = Math.min(...vals), hi = Math.max(...vals), r = hi - lo || 1;
    return vals.map((y, i) => `${(i / (vals.length - 1) * 100).toFixed(1)},${(32 - (y - lo) / r * 28).toFixed(1)}`).join(' ');
  };
  const pts = line(h.map(x => G.lower ? -x.v : x.v)), errs = h.some(x => x.e != null) ? line(h.map(x => x.e ?? 0)) : '';
  return `<svg viewBox="0 0 100 36" preserveAspectRatio="none" class="w-full h-14"><polygon points="0,36 ${pts} 100,36" fill="#e8b04b" fill-opacity=".12"/><polyline points="${pts}" fill="none" stroke="#e8b04b" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>${errs ? `<polyline points="${errs}" fill="none" stroke="#fb7185" stroke-width="1.4" stroke-dasharray="3 2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>` : ''}</svg>
    ${errs ? `<p class="mt-1 flex justify-center gap-4 text-[11px] text-zinc-500"><span class="flex items-center gap-1.5"><span class="w-3 h-0.5 bg-accent"></span>${t('result')}</span><span class="flex items-center gap-1.5"><span class="w-3 h-0.5 bg-rose-400"></span>${t('errors')}</span></p>` : ''}`;
}
const errAvg = h => { const e = h.slice(-10).filter(x => x.e != null); return e.length ? (e.reduce((a, x) => a + x.e, 0) / e.length).toFixed(1).replace(/\.0$/, '') : '—' };

/* --- shared widgets --- */
const keypad = () => `<div class="mt-5 grid grid-cols-3 gap-2 max-w-xs mx-auto select-none">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, '✓'].map(k => `<button type="button" data-k="${k}" class="bf-key ${k === '✓' ? '!bg-accent !text-ink-950' : ''}">${k}</button>`).join('')}</div>`;
// digit input from the on-screen pad and the physical keyboard
function pad(c, { digit, back, ok }) {
  c.el.addEventListener('click', e => {
    const k = e.target.closest('[data-k]')?.dataset.k; if (k == null) return;
    k === '⌫' ? back() : k === '✓' ? ok() : digit(k);
  });
  c.onKey(e => { if (/^\d$/.test(e.key)) digit(e.key); else if (e.key === 'Backspace') back(); else if (e.key === 'Enter') ok() });
}
const hud = items => `<div class="flex flex-wrap items-center justify-center gap-2 text-sm">${items.filter(Boolean).map(([k, v, id]) => `<span class="rounded-full border border-white/10 bg-ink-900 px-3 py-1 text-zinc-400">${k}: <b ${id ? `id="${id}"` : ''} class="text-white">${v}</b></span>`).join('')}</div>`;
const bar = () => `<div class="mt-4 h-1.5 rounded-full bg-white/10 overflow-hidden"><div id="cd" class="h-full bg-accent" style="width:100%"></div></div>`;
// countdown: updates the bar and ends the round
function countdown(c, sec, end) {
  const t0 = Date.now();
  c.every(() => {
    const left = sec - (Date.now() - t0) / 1000;
    const b = c.el.querySelector('#cd'); if (b) b.style.width = Math.max(0, left / sec * 100) + '%';
    if (left <= 0) end();
  }, 100);
}
const flash = (node, cls, ms = 350) => { if (!node) return; node.classList.add(cls); setTimeout(() => node.classList.remove(cls), ms) };
const msg = (txt, cls = 'text-zinc-400') => `<p class="mt-4 text-center text-sm ${cls}">${txt}</p>`;

/* ================= GAMES ================= */
// Each game: { id, cat, icon, name, short, modes: [{ k, name }], lower (smaller score is better), fmt, tags, help, run(c) }
// run(c) draws into c.el and calls c.done(score, errors) at the end; timers and keys go through c.later / c.every / c.onKey.
const GAMES = [];

/* --- digit span --- */
GAMES.push({
  id: 'span', cat: 'memory', icon: 'list-ordered', tags: ['classic', 'ancient'], fmt: v => v,
  name: tri('Цифровой ряд', 'Digit span', 'จำลำดับตัวเลข'),
  short: tri('Запомни цифры и повтори — прямо или задом наперёд.', 'Memorize the digits and repeat them, forwards or backwards.', 'จำตัวเลขแล้วพิมพ์ตาม ทั้งเรียงปกติและย้อนกลับ'),
  modes: [{ k: 'fwd', name: tri('Прямой', 'Forward', 'ตามลำดับ') }, { k: 'bwd', name: tri('Обратный', 'Backward', 'ย้อนกลับ') }],
  help: {
    about: tri('Классический тест объёма рабочей памяти: цифры появляются по одной, затем их нужно повторить. Ряд растёт, пока память не «переполнится».', 'The classic working-memory span test: digits appear one by one and you repeat them. The row grows until memory overflows.', 'แบบทดสอบความจำใช้งานแบบคลาสสิก ตัวเลขขึ้นทีละตัว แล้วให้พิมพ์ตาม แถวจะยาวขึ้นเรื่อย ๆ จนจำไม่ไหว'),
    how: tri('Смотрите на цифры, потом наберите их на панели или клавиатуре. Верно — ряд длиннее на одну цифру. Две ошибки подряд — конец. Счёт — самый длинный верный ряд. В обратном режиме вводите с конца.', 'Watch the digits, then type them on the pad or keyboard. Correct — the row grows by one. Two misses in a row end the game. Score: the longest correct row. In backward mode type from the end.', 'ดูตัวเลข แล้วพิมพ์บนแป้นหรือคีย์บอร์ด ถูกแล้วแถวจะยาวขึ้นหนึ่งตัว ผิดสองครั้งติดกันจบเกม คะแนนคือแถวที่ยาวที่สุดที่ตอบถูก โหมดย้อนกลับให้พิมพ์จากตัวท้าย'),
    tips: tri('Разбивайте ряд на группы по 3–4 цифры, как номер телефона, и проговаривайте их про себя. Для обратного режима «перечитайте» группы мысленно с конца.', 'Split the row into groups of 3–4 digits, like a phone number, and say them to yourself. For backward mode, reread the groups in your head from the end.', 'แบ่งตัวเลขเป็นกลุ่มละ 3–4 ตัวเหมือนเบอร์โทรศัพท์ แล้วท่องในใจ โหมดย้อนกลับให้นึกอ่านกลุ่มจากท้ายมาหน้า'),
    sci: tri('Большинство взрослых удерживают около 7 цифр (Миллер, 1956), а настоящая ёмкость — около 4 смысловых групп (Коуэн, 2001): поэтому группировка так помогает. Обратный порядок сложнее — он требует не только хранить, но и перерабатывать. Ведийские чтецы тысячелетиями тренировали то же самое: в джата-патхе слова текста повторяют вперёд, назад и снова вперёд.', 'Most adults hold about 7 digits (Miller, 1956), while true capacity is about 4 meaningful chunks (Cowan, 2001) — which is why grouping helps so much. Backward order is harder: it needs processing, not just storage. Vedic reciters trained the same thing for millennia: in jaṭā-pāṭha the words are recited forwards, backwards and forwards again.', 'ผู้ใหญ่ส่วนใหญ่จำได้ราว 7 ตัว (มิลเลอร์ ค.ศ. 1956) แต่ความจุจริงคือราว 4 กลุ่มที่มีความหมาย (โควาน ค.ศ. 2001) การจัดกลุ่มจึงช่วยมาก การทวนย้อนกลับยากกว่าเพราะต้องประมวลผลด้วย นักสวดพระเวทฝึกแบบนี้มาหลายพันปี ในวิธีชฏาปาฐะ คำจะถูกสวดไปข้างหน้า ย้อนกลับ และไปข้างหน้าอีกครั้ง'),
    src: [['Miller, 1956', 'https://doi.org/10.1037/h0043158'], ['Cowan, 2001', 'https://doi.org/10.1017/S0140525X01003922'], ['Vedic chant', 'https://en.wikipedia.org/wiki/Vedic_chant']],
  },
  run(c) {
    const back = c.mode === 'bwd';
    let len = 3, fails = 0, errs = 0, best = 0, seq = [], inp = '';
    const round = () => {
      seq = Array.from({ length: len }, () => rnd(0, 9)); inp = '';
      c.el.innerHTML = hud([[t('length'), len], [t('best'), best]]) + `<p class="mt-8 text-center text-sm text-zinc-500">${t('memorize')}</p><p id="sd" class="mt-2 h-32 grid place-items-center text-8xl font-extrabold text-white tabular-nums"></p>`;
      let i = 0;
      const show = () => {
        const d = c.el.querySelector('#sd');
        if (i >= len) return ask();
        d.textContent = seq[i++];
        c.later(() => { d.textContent = ''; c.later(show, 250) }, 750);
      };
      c.later(show, 700);
    };
    const ask = () => {
      c.el.innerHTML = hud([[t('length'), len], [t('best'), best]]) + `<p class="mt-8 text-center text-sm text-zinc-500">${t('yourTurn')}${back ? ' · ←' : ''}</p><p id="si" class="mt-2 h-16 text-center text-5xl font-bold tracking-[.3em] text-accent tabular-nums"></p>` + keypad() + `<div id="sm"></div>`;
      asking = true; showIn();
    };
    let asking = false, checking = false;
    const showIn = () => { const e = c.el.querySelector('#si'); if (e) e.textContent = inp.padEnd(len, '·') };
    pad(c, {
      digit: d => { if (asking && inp.length < len) { inp += d; showIn(); if (inp.length === len) c.later(check, 150) } },
      back: () => { if (asking) { inp = inp.slice(0, -1); showIn() } },
      ok: () => asking && inp.length === len && check(),
    });
    const check = () => {
      if (checking) return; checking = true; asking = false;
      const want = (back ? [...seq].reverse() : seq).join('');
      if (inp === want) { best = len; len++; fails = 0; c.el.querySelector('#sm').innerHTML = msg(t('ok'), 'text-emerald-300') }
      else { fails++; errs++; c.el.querySelector('#sm').innerHTML = msg(`${t('wrong')} · ${t('answerWas')} ${want}`, 'text-rose-300') }
      c.later(() => { checking = false; fails >= 2 ? c.done(best, errs) : round() }, 1100);
    };
    round();
  },
});

/* --- Corsi blocks --- */
GAMES.push({
  id: 'corsi', cat: 'memory', icon: 'grid-3x3', tags: ['classic'], fmt: v => v,
  name: tri('Блоки Корси', 'Corsi blocks', 'บล็อกคอร์ซี'),
  short: tri('Запомни, в каком порядке загорались квадраты.', 'Remember the order in which the squares lit up.', 'จำลำดับที่สี่เหลี่ยมสว่างขึ้น'),
  modes: [{ k: 'fwd', name: tri('Прямой', 'Forward', 'ตามลำดับ') }, { k: 'bwd', name: tri('Обратный', 'Backward', 'ย้อนกลับ') }],
  help: {
    about: tri('Пространственный двойник цифрового ряда: девять квадратов, разбросанных по полю, загораются по очереди. Тест придумал Филип Корси в 1972 году.', 'The spatial twin of digit span: nine scattered squares light up one by one. Philip Corsi devised the test in 1972.', 'แบบทดสอบคู่แฝดเชิงพื้นที่ของการจำตัวเลข สี่เหลี่ยมเก้าช่องที่วางกระจายจะสว่างทีละช่อง ฟิลิป คอร์ซี คิดค้นในปี 1972'),
    how: tri('Смотрите, затем нажмите квадраты в том же порядке (в обратном режиме — с конца). Верно — последовательность длиннее. Две ошибки подряд — конец. Счёт — самая длинная верная последовательность.', 'Watch, then tap the squares in the same order (backward mode: from the end). Correct — the sequence grows. Two misses in a row end the game. Score: the longest correct sequence.', 'ดูให้ดี แล้วแตะสี่เหลี่ยมตามลำดับเดิม (โหมดย้อนกลับเริ่มจากช่องสุดท้าย) ถูกแล้วลำดับจะยาวขึ้น ผิดสองครั้งติดกันจบเกม คะแนนคือลำดับที่ยาวที่สุดที่ตอบถูก'),
    tips: tri('Не пытайтесь запомнить квадраты по отдельности — следите за «рисунком» пути: зигзаг, треугольник, возврат. Взгляд можно вести за вспышками.', 'Don’t memorize squares one by one — follow the shape of the path: a zigzag, a triangle, a return. Let your eyes follow the flashes.', 'อย่าจำทีละช่อง ให้จำ “รูปทรง” ของเส้นทาง เช่น ซิกแซก สามเหลี่ยม หรือย้อนกลับ ปล่อยสายตาตามแสงไป'),
    sci: tri('У здоровых взрослых объём Корси обычно 5–6 — немного меньше, чем для цифр. Зрительно-пространственная и словесная память — разные системы: можно хорошо помнить цифры и хуже — пути, и наоборот.', 'Healthy adults usually reach a Corsi span of 5–6, a little below digit span. Visuospatial and verbal memory are separate systems: you can be good at digits and weaker at paths, or the other way round.', 'ผู้ใหญ่ทั่วไปจำได้ราว 5–6 ช่อง น้อยกว่าตัวเลขเล็กน้อย ความจำเชิงภาพและตำแหน่งกับความจำด้านภาษาเป็นคนละระบบ บางคนจำตัวเลขเก่งแต่จำเส้นทางได้น้อยกว่า หรือกลับกัน'),
    src: [['Corsi block-tapping test', 'https://en.wikipedia.org/wiki/Corsi_block-tapping_test']],
  },
  run(c) {
    const back = c.mode === 'bwd';
    let len = 2, fails = 0, errs = 0, best = 0, seq = [], taps = [], input = false;
    c.el.innerHTML = hud([[t('length'), len, 'cl'], [t('best'), best, 'cb']]) + `<p id="cm" class="mt-4 text-center text-sm text-zinc-500"></p>
      <div id="cbox" class="relative mx-auto mt-4 w-full max-w-md aspect-square rounded-2xl border border-white/10 bg-ink-900">${CORSI.map(([x, y], i) => `<button type="button" data-b="${i}" class="cell absolute" style="left:${x}%;top:${y}%;width:15%;height:15%"></button>`).join('')}</div><div id="cr"></div>`;
    const blk = i => c.el.querySelector(`[data-b="${i}"]`);
    const round = () => {
      c.el.querySelector('#cl').textContent = len; c.el.querySelector('#cb').textContent = best; c.el.querySelector('#cr').innerHTML = '';
      c.el.querySelector('#cm').textContent = t('memorize');
      seq = []; while (seq.length < len) { const b = rnd(0, 8); if (b !== seq[seq.length - 1]) seq.push(b) }
      taps = []; input = false;
      let i = 0;
      const show = () => {
        if (i >= len) { input = true; c.el.querySelector('#cm').textContent = t('yourTurn') + (back ? ' · ←' : ''); return }
        const b = blk(seq[i++]); b.classList.add('lit');
        c.later(() => { b.classList.remove('lit'); c.later(show, 250) }, 600);
      };
      c.later(show, 700);
    };
    c.el.addEventListener('click', e => {
      const b = e.target.closest('[data-b]'); if (!b || !input) return;
      taps.push(+b.dataset.b); flash(b, 'lit', 200);
      if (taps.length < len) return;
      input = false;
      const want = back ? [...seq].reverse() : seq, ok = want.every((x, i) => x === taps[i]);
      if (ok) { best = len; len++; fails = 0; c.el.querySelector('#cr').innerHTML = msg(t('ok'), 'text-emerald-300') }
      else { fails++; errs++; c.el.querySelector('#cr').innerHTML = msg(t('wrong'), 'text-rose-300') }
      c.later(() => fails >= 2 ? c.done(best, errs) : round(), 1000);
    });
    round();
  },
});

GAMES.push({

  short: tri('Найди все пары карточек за минимум ходов.', 'Find every pair of cards in as few moves as possible.', 'หาไพ่ที่เป็นคู่ให้ครบโดยใช้จำนวนครั้งน้อยที่สุด'),
  modes: [{ k: '12', name: tri('12 карт', '12 cards', '12 ใบ') }, { k: '16', name: tri('16 карт', '16 cards', '16 ใบ') }, { k: '24', name: tri('24 карты', '24 cards', '24 ใบ') }],
  help: {
    about: tri('Знакомая всем «Мемори»: карточки лежат рубашкой вверх, за ход открываются две. Тренирует запоминание мест и связей «что где лежит».', 'The well-known Memory game: cards lie face down and you turn two per move. It trains remembering places and what lies where.', 'เกมจับคู่ที่ทุกคนรู้จัก ไพ่คว่ำอยู่ เปิดได้ครั้งละสองใบ ช่วยฝึกจำตำแหน่งและว่าอะไรอยู่ตรงไหน'),
    how: tri('Открывайте по две карточки. Совпали — остаются открытыми, нет — переворачиваются обратно. Счёт — число ходов (пар открытых карточек), меньше — лучше.', 'Turn over two cards at a time. A match stays open, otherwise they flip back. Score: the number of moves (pairs turned), lower is better.', 'เปิดครั้งละสองใบ ถ้าตรงกันจะเปิดค้างไว้ ถ้าไม่ตรงจะคว่ำกลับ คะแนนคือจำนวนครั้งที่เปิด ยิ่งน้อยยิ่งดี'),
    tips: tri('Называйте про себя каждую открытую картинку и её место: «звезда — второй ряд, слева». Начинайте с одного угла и открывайте систематически, а не вразброс.', 'Name every card you see and its place to yourself: “star — second row, left”. Start in one corner and work systematically, not at random.', 'พูดในใจชื่อภาพและตำแหน่งทุกครั้ง เช่น “ดาว แถวสอง ซ้าย” เริ่มจากมุมหนึ่งแล้วเปิดอย่างเป็นระบบ ไม่สุ่มไปมา'),
    sci: tri('Проговаривание (словесное кодирование) — проверенный способ удержать зрительную информацию дольше: у места появляется «ярлык» в словесной памяти.', 'Naming things aloud or silently (verbal coding) is a well-tested way to hold visual information longer: the place gets a label in verbal memory too.', 'การพูดชื่อสิ่งที่เห็น (การเข้ารหัสด้วยคำ) เป็นวิธีที่ได้ผลในการจำภาพให้นานขึ้น เพราะตำแหน่งจะมี “ป้ายชื่อ” อยู่ในความจำด้านภาษาด้วย'),
    src: [],
  },
  run(c) {

/* --- timed arithmetic --- */
function mathTask(mode) {
  if (mode === 'add') { const a = rnd(10, 99), b = rnd(10, 99); return Math.random() < .5 ? [`${a} + ${b}`, a + b] : [`${Math.max(a, b)} − ${Math.min(a, b)}`, Math.abs(a - b)] }
  if (mode === 'mul') { const a = rnd(2, 12), b = rnd(2, 12); return Math.random() < .5 ? [`${a} × ${b}`, a * b] : [`${a * b} ÷ ${a}`, b] }
  const a = rnd(2, 20), b = rnd(2, 9), k = rnd(2, 9), r = rnd(0, 2);
  if (r === 0) return [`${a} + ${b} × ${k}`, a + b * k];
  if (r === 1) return [`(${a} + ${b}) × ${k}`, (a + b) * k];
  return [`${b * k + a} − ${b} × ${k}`, a];
}

  help: {
    about: tri('Таблицы приписывают немецкому психиатру Вальтеру Шульте (1910–1972), который с 1960 года руководил университетской нервной клиникой в Тюбингене и известен открытием антидепрессивного эффекта лишения сна. Оригинальную публикацию с таблицами найти не удалось — поэтому сомнения понятны. В СССР таблицы стали классикой психодиагностики внимания, а психолог Ф. Д. Горбов придумал красно-чёрный вариант на переключение внимания.', 'The tables are attributed to the German psychiatrist Walter Schulte (1910–1972), who headed Tübingen’s university neuropsychiatric clinic from 1960 and is known for discovering the antidepressant effect of sleep deprivation. His original publication of the tables could not be found, so doubts are understandable. In the USSR the tables became a staple of attention testing, and the psychologist F. D. Gorbov added the red-black version for switching attention.', 'ตารางนี้ถือกันว่าเป็นของจิตแพทย์ชาวเยอรมัน วัลเทอร์ ชุลเทอ (ค.ศ. 1910–1972) ผู้อำนวยการคลินิกประสาทวิทยามหาวิทยาลัยทือบิงเงินตั้งแต่ ค.ศ. 1960 และเป็นผู้ค้นพบว่าการอดนอนช่วยบรรเทาซึมเศร้า แต่ยังหาสิ่งพิมพ์ต้นฉบับเรื่องตารางของเขาไม่พบ จึงเข้าใจได้ที่มีข้อสงสัย ในสหภาพโซเวียต ตารางนี้กลายเป็นแบบทดสอบสมาธิมาตรฐาน และนักจิตวิทยา เอฟ. ดี. กอร์บอฟ คิดแบบแดง-ดำสำหรับฝึกสลับความสนใจ'),
    how: tri('Классика: нажмите числа от 1 до 25 по порядку. Перемешивание: после каждого верного нажатия числа меняют места. Горбова: 25 белых и 24 красных числа; чередуйте белое по возрастанию и красное по убыванию: б1, к24, б2, к23… до б25. Счёт — время, меньше — лучше.', 'Classic: tap 1 to 25 in order. Reshuffle: the numbers move after every correct tap. Gorbov: 25 white and 24 red numbers; alternate white ascending and red descending: w1, r24, w2, r23… up to w25. Score: time, lower is better.', 'คลาสสิก: แตะเลข 1 ถึง 25 ตามลำดับ แบบสลับ: ตัวเลขจะเปลี่ยนที่ทุกครั้งที่แตะถูก กอร์บอฟ: มีเลขสีขาว 25 ตัวและสีแดง 24 ตัว ให้สลับขาวจากน้อยไปมากกับแดงจากมากไปน้อย: ข1, ด24, ข2, ด23… จนถึง ข25 คะแนนคือเวลา ยิ่งน้อยยิ่งดี'),
    tips: tri('Смотрите в центр таблицы (красная точка) и старайтесь видеть всю таблицу целиком, «периферией», не бегая глазами. Сначала добивайтесь ровного ритма, потом — скорости. Хорошие результаты для 5×5 — около 20–30 секунд, отличные — меньше 15.', 'Keep your eyes on the centre (the red dot) and try to take in the whole table at once with your periphery, without darting around. Aim for a steady rhythm first, then speed. Good 5×5 times are around 20–30 seconds, excellent ones under 15.', 'มองที่กลางตาราง (จุดแดง) แล้วพยายามเห็นทั้งตารางด้วยสายตารอบข้าง ไม่กวาดตาไปมา ทำจังหวะให้สม่ำเสมอก่อน แล้วค่อยเพิ่มความเร็ว ตาราง 5×5 ผลดีคือราว 20–30 วินาที ผลดีเยี่ยมคือต่ำกว่า 15'),
    sci: tri('Таблицы Шульте — прежде всего диагностический инструмент: по времени и его колебаниям оценивают устойчивость и переключение внимания. Время с практикой уверенно падает, но строгих исследований о том, что они расширяют «периферическое зрение» в жизни, почти нет. Если цель — именно поле зрения, лучше всего проверена тренировка UFOV (соседняя игра).', 'Schulte tables are first of all a diagnostic tool: time and its variation measure the stability and switching of attention. Times reliably drop with practice, but there is little rigorous research showing they widen real-life peripheral vision. If the field of view is your goal, UFOV training (the next game) is far better tested.', 'ตารางชุลเทอเป็นเครื่องมือวินิจฉัยเป็นหลัก ใช้เวลาและความแปรปรวนวัดความมั่นคงและการสลับความสนใจ เวลาจะลดลงเมื่อฝึก แต่แทบไม่มีงานวิจัยเข้มงวดที่แสดงว่าช่วยขยายการมองเห็นรอบข้างในชีวิตจริง ถ้าเป้าหมายคือขอบเขตการมองเห็น การฝึกแบบ UFOV (เกมถัดไป) ผ่านการพิสูจน์มากกว่ามาก'),
    src: [['Walter Schulte — LEO-BW', 'https://www.leo-bw.de/en/detail/-/Detail/details/DOKUMENT/ubt_portraits/34989/Schulte%20Walter'], ['Uni Tübingen: Geschichte der Klinik', 'https://www.medizin.uni-tuebingen.de/de/das-klinikum/einrichtungen/kliniken/psychiatrie-und-psychotherapie/allgemeine-psychiatrie/geschichte-der-klinik']],
  },
  run(c) {
    const gorbov = c.mode === 'gorbov', side = gorbov ? 7 : 5;
    // order of targets: [number, red?]
    const order = gorbov ? Array.from({ length: 49 }, (_, k) => k % 2 ? [24 - (k - 1) / 2, true] : [k / 2 + 1, false]) : Array.from({ length: 25 }, (_, k) => [k + 1, false]);
    let cells = shuffle(order), at = 0, errs = 0;
    const t0 = Date.now();
    const draw = () => {
      c.el.querySelector('#sg').innerHTML = cells.map(([n, red], k) => `<button type="button" data-q="${k}" class="cell aspect-square ${gorbov ? 'text-lg sm:text-2xl' : 'text-2xl sm:text-3xl'} ${red ? '!text-rose-400' : ''}">${n}</button>`).join('');
    };
    c.el.innerHTML = hud([[t('time'), '0.0', 'st'], [t('shFind'), `0 / ${order.length}`, 'sf'], [t('errors'), 0, 'se']]) + `
      <div class="relative mt-6 mx-auto w-full max-w-md"><div id="sg" class="grid gap-1.5" style="grid-template-columns:repeat(${side},minmax(0,1fr))"></div>
      <span class="pointer-events-none absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full bg-rose-500 shadow-[0_0_10px_#f43f5e]"></span></div>`;
    draw();
    c.every(() => { const e = c.el.querySelector('#st'); if (e) e.textContent = ((Date.now() - t0) / 1000).toFixed(1) }, 100);
    c.el.addEventListener('click', e => {
      const b = e.target.closest('[data-q]'); if (!b) return;
      const [n, red] = cells[b.dataset.q], [wn, wred] = order[at];
      if (n !== wn || red !== wred) { errs++; c.el.querySelector('#se').textContent = errs; return flash(b, 'bad-flash', 300) }
      at++; c.el.querySelector('#sf').textContent = `${at} / ${order.length}`;
      if (at === order.length) return c.done(Math.round((Date.now() - t0) / 100) / 10, errs);
      if (c.mode === 'mix') { cells = shuffle(cells); draw() } else flash(b, 'ok-flash', 200);
    });
  },
});

    sci: tri('Это лучше всего проверенная «мозговая» тренировка. В рандомизированном исследовании ACTIVE (2802 пожилых человека) такие упражнения на скорость обработки снизили риск деменции на 29% за 10 лет (Эдвардс и др., 2017), а в других работах — число аварий по вине водителя. Тренировки памяти и рассуждений в том же исследовании такого эффекта не дали. Наша версия — упрощённая, но устроена так же: центр + периферия + маска + адаптивное время.', 'This is the best-tested brain training there is. In the randomized ACTIVE trial (2,802 older adults), this kind of speed-of-processing training cut dementia risk by 29% over 10 years (Edwards et al., 2017), and other studies found fewer at-fault car crashes. Memory and reasoning training in the same trial showed no such effect. Ours is a simplified version built the same way: centre + periphery + mask + adaptive timing.', 'นี่คือการฝึกสมองที่ผ่านการพิสูจน์มากที่สุด ในงานวิจัยแบบสุ่ม ACTIVE (ผู้สูงอายุ 2,802 คน) การฝึกความเร็วในการประมวลผลแบบนี้ลดความเสี่ยงสมองเสื่อมได้ 29% ใน 10 ปี (เอ็ดเวิร์ดส์และคณะ ค.ศ. 2017) และงานอื่นพบว่าอุบัติเหตุที่ผู้ขับเป็นฝ่ายผิดลดลง ส่วนการฝึกความจำและการใช้เหตุผลในงานเดียวกันไม่ได้ผลแบบนี้ เวอร์ชันของเราเป็นแบบย่อแต่หลักการเดียวกัน: ตรงกลาง + รอบข้าง + ภาพรบกวน + เวลาที่ปรับตามความสามารถ'),
    src: [['Edwards et al., 2017', 'https://doi.org/10.1016/j.trci.2017.09.002'], ['ACTIVE (BrainHQ summary)', 'https://www.brainhq.com/world-class-science/published-research/active-study']],

        ${sel ? pos.map((p, k) => at(p, '▲', `uf-d uf-dp${k} invisible text-2xl text-zinc-500`)).join('') + inner.map(p => at(p, '▲', 'uf-d invisible text-2xl text-zinc-500')).join('') : ''}

  { icon: 'target', tags: ['proof'], t: tri('Сказать вслух, что сделать', 'Say what you will do', 'พูดออกมาว่าจะทำอะไร'),
    d: tri('Твой «аутотренинг» близок к планам «если — то»: «когда начну, я выучу двадцать слов». Мета-анализ 94 исследований показал заметный рост выполнения целей (Gollwitzer & Sheeran, 2006). Чёткая цель вслух — дешёвый и сильный приём.', 'Your “autotraining” is close to if-then plans: “when I start, I will learn twenty words”. A meta-analysis of 94 studies found a clear rise in reaching goals (Gollwitzer & Sheeran, 2006). A clear goal said aloud is a cheap and strong trick.', '“การฝึกสะกดจิตตัวเอง” ของคุณใกล้เคียงกับแผน “ถ้า… ก็…” เช่น “เมื่อเริ่มแล้ว ฉันจะจำคำศัพท์ยี่สิบคำ” การวิเคราะห์อภิมานจาก 94 งานวิจัยพบว่าทำให้บรรลุเป้าหมายได้มากขึ้นชัดเจน (Gollwitzer & Sheeran ค.ศ. 2006) การพูดเป้าหมายที่ชัดเจนออกมาเป็นวิธีที่ง่ายแต่ได้ผล'),
    src: [['Gollwitzer & Sheeran, 2006', 'https://doi.org/10.1016/S0065-2601(06)38002-1']] },
  { icon: 'circle-help', tags: ['data'], t: tri('Любопытство и догадка', 'Curiosity and a guess', 'ความอยากรู้และการเดา'),
    d: tri('Когда нам любопытно, включается тот же дофаминовый контур, что и при награде, и запоминается лучше — даже то, что попалось попутно (Gruber, 2014). А попытка угадать ответ до изучения, даже неверная, помогает запомнить правильный (Kornell, 2009).', 'When we are curious, the same dopamine circuit as for rewards switches on and memory improves — even for things we meet along the way (Gruber, 2014). And guessing an answer before studying, even wrongly, helps you remember the right one (Kornell, 2009).', 'เมื่อเราอยากรู้ วงจรโดปามีนเดียวกับตอนได้รางวัลจะทำงาน และเราจะจำได้ดีขึ้น แม้แต่สิ่งที่ผ่านมาโดยบังเอิญ (Gruber ค.ศ. 2014) และการลองเดาคำตอบก่อนเรียน แม้เดาผิด ก็ช่วยให้จำคำตอบที่ถูกได้ (Kornell ค.ศ. 2009)'),
    src: [['Gruber et al., 2014', 'https://doi.org/10.1016/j.neuron.2014.08.060'], ['Kornell et al., 2009', 'https://doi.org/10.1037/a0015729']] },
  { icon: 'pen-line', tags: ['data'], t: tri('Выписать тревогу', 'Write the worry out', 'เขียนความกังวลออกมา'),
    d: tri('Тревога съедает рабочую память. Ученики, которые 10 минут перед экзаменом писали о своих страхах, сдали лучше тех, кто просто сидел (Ramirez & Beilock, 2011, Science). В стартере это необязательный шаг.', 'Worry eats working memory. Students who spent 10 minutes before an exam writing about their fears scored better than those who just sat (Ramirez & Beilock, 2011, Science). In the starter it is an optional step.', 'ความกังวลกินความจำใช้งาน นักเรียนที่เขียนเรื่องความกลัวของตัวเอง 10 นาทีก่อนสอบได้คะแนนดีกว่าคนที่นั่งเฉย ๆ (Ramirez & Beilock ค.ศ. 2011 วารสาร Science) ในสตาร์ตเตอร์ขั้นนี้ไม่บังคับ'),
    src: [['Ramirez & Beilock, 2011', 'https://doi.org/10.1126/science.1199427']] },
  { icon: 'bed-single', tags: ['data'], t: tri('Тишина после учёбы', 'Quiet after learning', 'ความเงียบหลังเรียน'),
    d: tri('10 минут спокойного отдыха с закрытыми глазами сразу после заучивания улучшили запоминание через неделю — по сравнению с теми, кто сразу переключился на другое (Dewar, 2012). Поэтому сессия заканчивается двумя минутами тишины, а не телефоном.', '10 minutes of quiet rest with eyes closed right after learning improved recall a week later, compared with switching straight to something else (Dewar, 2012). That is why the session ends with two quiet minutes, not the phone.', 'การพักเงียบ ๆ หลับตา 10 นาทีหลังท่องจำ ช่วยให้จำได้ดีขึ้นในอีกหนึ่งสัปดาห์ เทียบกับคนที่เปลี่ยนไปทำอย่างอื่นทันที (Dewar ค.ศ. 2012) ช่วงเรียนจึงจบด้วยความเงียบสองนาที ไม่ใช่โทรศัพท์'),
    src: [['Dewar et al., 2012', 'https://doi.org/10.1177/0956797612441220']] },
  { icon: 'cup-soda', tags: ['data'], t: tri('Кофеин и чай', 'Caffeine and tea', 'คาเฟอีนและชา'),
    d: tri('Надёжный эффект кофеина — бодрость и внимание; на саму память он действует непостоянно: в одних опытах помогает закреплению (200 мг после заучивания, Borota, 2014), в других эффекта нет. С L-теанином из чая внимание лучше, чем от одного кофеина (Owen, 2008). Здоровым взрослым безопасно до 400 мг в день — около 3–4 чашек кофе.', 'Caffeine’s reliable effect is alertness and attention; its effect on memory itself is inconsistent: some studies find better consolidation (200 mg after learning, Borota, 2014), others none. With L-theanine from tea, attention is better than with caffeine alone (Owen, 2008). Up to 400 mg a day is safe for healthy adults — about 3–4 cups of coffee.', 'ผลที่แน่นอนของคาเฟอีนคือความตื่นตัวและสมาธิ ส่วนผลต่อความจำไม่คงที่ บางงานพบว่าช่วยตอกย้ำความจำ (200 มิลลิกรัมหลังท่องจำ Borota ค.ศ. 2014) บางงานไม่พบผล เมื่อรวมกับแอล-ธีอะนีนในชา สมาธิดีกว่าคาเฟอีนอย่างเดียว (Owen ค.ศ. 2008) ผู้ใหญ่สุขภาพดีรับได้วันละไม่เกิน 400 มิลลิกรัม ราว 3–4 แก้วกาแฟ'),
    src: [['Borota et al., 2014', 'https://doi.org/10.1038/nn.3623'], ['Owen et al., 2008', 'https://doi.org/10.1179/147683008X301513']] },
  { icon: 'siren', tags: ['proof'], t: tri('«Словно от этого зависит жизнь»', '“As if your life depended on it”', '“ราวกับชีวิตขึ้นอยู่กับมัน”'),
    d: tri('Если оценивать информацию вопросом «пригодится ли это, чтобы выжить», она запоминается лучше почти любой другой техники — эффект повторён десятки раз (Nairne, 2007). Работает не страх, а глубина и личная значимость: мозг сильнее прорабатывает то, что связано с важным для нас. Отсюда в стартере вопрос «зачем это лично мне».', 'Rating information by “would this help me survive?” makes it stick better than almost any other technique — the effect has been replicated dozens of times (Nairne, 2007). It is not fear that works but depth and personal relevance: the brain processes harder whatever is tied to what matters to us. Hence the starter’s question “why does this matter to me”.', 'ถ้าประเมินข้อมูลด้วยคำถามว่า “สิ่งนี้ช่วยให้รอดชีวิตได้ไหม” จะจำได้ดีกว่าเทคนิคแทบทุกแบบ ผลนี้ถูกทดลองซ้ำหลายสิบครั้ง (Nairne ค.ศ. 2007) ที่ได้ผลไม่ใช่ความกลัว แต่คือความลึกและความสำคัญต่อตัวเรา สมองประมวลผลสิ่งที่ผูกกับเรื่องสำคัญของเราได้หนักกว่า สตาร์ตเตอร์จึงมีคำถามว่า “เรื่องนี้สำคัญกับฉันอย่างไร”'),
    src: [['Nairne et al., 2007', 'https://doi.org/10.1037/0278-7393.33.2.263']] },
  { icon: 'key', tags: ['classic'], t: tri('Ритуал как ключ к памяти', 'A ritual as a memory key', 'พิธีกรรมเป็นกุญแจความจำ'),
    d: tri('Вспоминается легче в той же обстановке и в том же состоянии, в которых учили: водолазы лучше вспоминали слова, выученные под водой, снова под водой (Godden & Baddeley, 1975). Повторяйте тот же стартер и перед проверкой себя — он станет знакомым контекстом. Новизна тоже помогает: она включает дофаминовый контур памяти (Lisman & Grace, 2005).', 'Recall is easier in the same setting and state as learning: divers remembered words learned underwater better when back underwater (Godden & Baddeley, 1975). Repeat the same starter before testing yourself and it becomes a familiar context. Novelty helps too: it switches on the brain’s dopamine memory loop (Lisman & Grace, 2005).', 'เราจะนึกออกง่ายขึ้นในสถานที่และสภาวะเดียวกับตอนเรียน นักดำน้ำจำคำที่เรียนใต้น้ำได้ดีกว่าเมื่อกลับลงไปใต้น้ำ (Godden & Baddeley ค.ศ. 1975) ทำสตาร์ตเตอร์แบบเดิมก่อนทดสอบตัวเองด้วย แล้วมันจะกลายเป็นบริบทที่คุ้นเคย ความแปลกใหม่ก็ช่วย เพราะกระตุ้นวงจรโดปามีนของความจำ (Lisman & Grace ค.ศ. 2005)'),
    src: [['Godden & Baddeley, 1975', 'https://doi.org/10.1111/j.2044-8295.1975.tb01468.x'], ['Lisman & Grace, 2005', 'https://doi.org/10.1016/j.neuron.2005.05.002']] },
  { icon: 'moon-star', tags: ['proof'], t: tri('Сон закрепляет', 'Sleep consolidates', 'การนอนช่วยตอกย้ำ'),
    d: tri('Во сне мозг «проигрывает» выученное днём и переносит в долговременную память. Учить новое во сне нельзя, но подсказки во сне укрепляют уже выученное: запах, который был во время учёбы, усилил память, когда его давали в глубоком сне (Rasch, 2007, Science).', 'During sleep the brain replays the day’s learning and moves it into long-term memory. You cannot learn new things asleep, but cues during sleep strengthen what you already learned: an odour present while studying boosted memory when given again in deep sleep (Rasch, 2007, Science).', 'ระหว่างนอน สมองจะ “เล่นซ้ำ” สิ่งที่เรียนตอนกลางวันและย้ายไปเป็นความจำระยะยาว เรียนเรื่องใหม่ตอนหลับไม่ได้ แต่สิ่งกระตุ้นตอนหลับช่วยตอกย้ำสิ่งที่เรียนแล้ว กลิ่นที่ได้กลิ่นตอนเรียนช่วยความจำเมื่อได้กลิ่นอีกครั้งตอนหลับลึก (Rasch ค.ศ. 2007 วารสาร Science)'),
    src: [['Rasch et al., 2007', 'https://doi.org/10.1126/science.1138581']] },
  { icon: 'pill', tags: ['myth'], t: tri('DMAE, бромелайн, витамины', 'DMAE, bromelain, vitamins', 'DMAE โบรมีเลน วิตามิน'),
    d: tri('Надёжных исследований, что DMAE или бромелайн улучшают память здоровых людей, нет: по DMAE прямых клинических проверок почти не делали, а положительные данные о бромелайне получены только на крысах и мышах. Витамины помогают при дефиците (B12, D) — его проверяют анализом. В большом исследовании COSMOS поливитамины дали пожилым небольшой плюс к памяти. Чудо-таблетки не найдено.', 'There is no solid research showing DMAE or bromelain improve memory in healthy people: DMAE has barely been tested in clinical trials, and the positive bromelain data come only from rats and mice. Vitamins help with a deficiency (B12, D), which a blood test finds. In the large COSMOS trial, multivitamins gave older adults a small memory benefit. No miracle pill has been found.', 'ยังไม่มีงานวิจัยที่น่าเชื่อถือว่า DMAE หรือโบรมีเลนช่วยความจำของคนสุขภาพดี DMAE แทบไม่เคยถูกทดสอบทางคลินิก ส่วนข้อมูลเชิงบวกของโบรมีเลนมาจากหนูทดลองเท่านั้น วิตามินช่วยได้เมื่อขาด (B12, D) ซึ่งตรวจเลือดได้ ในงานวิจัยขนาดใหญ่ COSMOS วิตามินรวมช่วยความจำของผู้สูงอายุได้เล็กน้อย ยังไม่พบยาวิเศษ'),
    src: [['COSMOS (Yeung et al., 2023)', 'https://doi.org/10.1016/j.ajcnut.2023.05.011']] },
  { icon: 'headphones', tags: ['debate'], t: tri('Бинауральные ритмы и «эффект Моцарта»', 'Binaural beats and the “Mozart effect”', 'คลื่นเสียงไบนอรัลและ “ปรากฏการณ์โมสาร์ท”'),
    d: tri('Бинауральные ритмы в наушниках в мета-анализе дали небольшой и неустойчивый эффект на внимание и память — исследования сильно расходятся. «Эффект Моцарта» оказался просто приятным возбуждением от музыки: интеллект он не поднимает. Любимая музыка без слов фоном — пожалуйста, но ждать чуда не стоит.', 'Binaural beats through headphones showed a small, unstable effect on attention and memory in a meta-analysis — studies disagree a lot. The “Mozart effect” turned out to be the pleasant arousal music gives: it does not raise intelligence. Favourite instrumental music in the background is fine, but don’t expect miracles.', 'คลื่นเสียงไบนอรัลผ่านหูฟังมีผลต่อสมาธิและความจำเพียงเล็กน้อยและไม่แน่นอนในการวิเคราะห์อภิมาน งานวิจัยยังขัดแย้งกันมาก “ปรากฏการณ์โมสาร์ท” เป็นแค่ความตื่นตัวที่น่ารื่นรมย์จากดนตรี ไม่ได้เพิ่มเชาวน์ปัญญา เปิดดนตรีบรรเลงที่ชอบคลอได้ แต่อย่าหวังปาฏิหาริย์'),
    src: [['Garcia-Argibay et al., 2019', 'https://doi.org/10.1007/s00426-018-1066-8']] },
  { icon: 'eye-off', tags: ['myth'], t: tri('Подсознательное обучение', 'Subliminal learning', 'การเรียนรู้ผ่านจิตใต้สำนึก'),
    d: tri('Записи «для подсознания», учёба во сне и «25-й кадр» не работают: в строгих проверках люди не запоминали новые факты, которых не видели или не слышали осознанно. Единственный короткий путь к памяти — через внимание, а внимание как раз и настраивает стартер.', 'Tapes “for the subconscious”, learning in your sleep and hidden frames do not work: in rigorous tests people did not learn new facts they had not consciously seen or heard. The only shortcut to memory runs through attention — which is exactly what the starter tunes.', 'เทป “สำหรับจิตใต้สำนึก” การเรียนตอนหลับ และ “เฟรมที่ 25” ใช้ไม่ได้ผล ในการทดสอบอย่างเข้มงวด คนไม่ได้จำข้อเท็จจริงใหม่ที่ไม่ได้เห็นหรือได้ยินอย่างรู้ตัว ทางลัดเดียวสู่ความจำคือความใส่ใจ ซึ่งเป็นสิ่งที่สตาร์ตเตอร์ช่วยปรับ'),
    src: [] },
];

    how: tri('Встаньте и двигайтесь в лёгком темпе: шаг на месте, 15 приседаний, круги руками, наклоны. Не до одышки — до тепла. А потом сядьте не так, как обычно: новизна тоже включает режим обучения.', 'Stand up and move at an easy pace: march on the spot, 15 squats, arm circles, side bends. Not until breathless — until warm. Then sit somewhere or somehow different from usual: novelty also switches on learning mode.', 'ลุกขึ้นและขยับเบา ๆ ย่ำเท้าอยู่กับที่ สควอต 15 ครั้ง หมุนแขน เอียงตัว ไม่ต้องถึงขั้นหอบ แค่รู้สึกอุ่นตัว แล้วนั่งต่างไปจากปกติ ความแปลกใหม่ก็ช่วยเปิดโหมดเรียนรู้') },

const GAME = Object.fromEntries(GAMES.map(G => [G.id, G]));
const modeKey = id => store.get(`bf-mode:${id}`, GAME[id].modes[0].k);
let cur = null;   // { G, tab, mode, ctx }

function makeCtx(el, G, mode) {
  const timers = [], keys = [];
  const ctx = {
    el, mode, best: bestOf(G, mode),
    later: (f, ms) => timers.push(setTimeout(f, ms)),
    every: (f, ms) => timers.push(setInterval(f, ms)),
    onKey: f => keys.push(f),
    key: e => keys.forEach(f => f(e)),
    stop() { timers.forEach(clearTimeout); timers.length = 0; keys.length = 0 },
    done(v, e) { ctx.stop(); showResult(G, mode, v, e) },
  };
  return ctx;
}
function stopGame() { cur?.ctx?.stop(); if (cur) cur.ctx = null }

function openGame(id, tab = 'play') {

  const G = GAME[id];

  $('#game').classList.remove('hidden'); document.body.classList.add('overflow-hidden');
  renderGame();
}

    ${ok ? `<p class="mt-4 text-6xl font-extrabold text-white tabular-nums">${G.fmt(v)}</p>` : `<p class="mt-4 text-zinc-400">${t('noScore')}</p>`}
    ${e != null ? `<p class="mt-2 text-lg ${e ? 'text-rose-300' : 'text-emerald-300'}">${t('errors')}: <b>${e}</b></p>` : ''}
    <p class="mt-3 text-sm text-zinc-500">${L(G.modes.find(m => m.k === mode).name)} · ${t('best')}: ${bestOf(G, mode) == null ? '—' : G.fmt(bestOf(G, mode))} · ${t('sessions')}: ${hist(G.id, mode).length}</p>
    <div class="mt-5">${spark(G, hist(G.id, mode).slice(-30))}</div>
    <div class="mt-6 flex flex-wrap justify-center gap-3">
      <button id="gStart" class="inline-flex items-center gap-2 rounded-xl bg-accent px-6 py-3 font-semibold text-ink-950 hover:brightness-110 transition"><i data-lucide="rotate-ccw" class="w-4 h-4"></i>${t('again')}</button>
      <button data-tab="play" class="rounded-xl border border-white/10 px-6 py-3 font-semibold hover:bg-white/5 transition">${t('toModes')}</button>
      <button data-tab="help" class="rounded-xl border border-white/10 px-6 py-3 font-semibold hover:bg-white/5 transition">${t('help')}</button>
    </div></div>`;
  icons();
}
function renderHelp() {
  const { G } = cur, h = G.help;
  const block = (k, ic, txt) => `<div class="rounded-2xl border border-white/10 bg-ink-900 p-5"><h3 class="flex items-center gap-2 font-semibold text-white"><i data-lucide="${ic}" class="w-4 h-4 text-accent"></i>${t(k)}</h3><p class="mt-2 text-sm text-zinc-400 leading-relaxed">${txt}</p></div>`;
  $('#gBody').innerHTML = `<div class="fade-up space-y-3">
    <div class="flex flex-wrap gap-2">${G.tags.map(tagHTML).join('')}</div>
    ${block('hAbout', 'info', L(h.about))}${block('hHow', 'gamepad-2', L(h.how))}${block('hTips', 'lightbulb', L(h.tips))}${block('hSci', 'flask-conical', L(h.sci))}
    ${h.src.length ? `<p class="pt-2 text-xs text-zinc-500">${t('hSrc')}: ${h.src.map(([n, u]) => `<a class="underline hover:text-white" href="${u}" target="_blank" rel="noopener">${n}</a>`).join(' · ')}</p>` : ''}
  </div>`;
}
function renderGameStats() {
  const { G } = cur;
  $('#gBody').innerHTML = `<div class="fade-up grid sm:grid-cols-2 gap-3">${G.modes.map(m => {
    const h = hist(G.id, m.k), b = bestOf(G, m.k);
    return `<div class="rounded-2xl border border-white/10 bg-ink-900 p-5">
      <p class="font-semibold text-white">${L(m.name)}</p>
      <div class="mt-3 grid grid-cols-3 gap-2 text-center">
        <div><p class="text-xs text-zinc-500">${t('best')}</p><p class="font-bold text-white">${b == null ? '—' : G.fmt(b)}</p></div>
        <div><p class="text-xs text-zinc-500">${t('last')}</p><p class="font-bold text-white">${h.length ? G.fmt(h[h.length - 1].v) : '—'}</p></div>
        <div><p class="text-xs text-zinc-500">${t('sessions')}</p><p class="font-bold text-white">${h.length}</p></div>
      </div>
      <div class="mt-2 grid grid-cols-2 gap-2 text-center">
        <div><p class="text-xs text-zinc-500">${t('errLast')}</p><p class="font-bold text-rose-300">${h.length && h[h.length - 1].e != null ? h[h.length - 1].e : '—'}</p></div>
        <div><p class="text-xs text-zinc-500">${t('errAvg')}</p><p class="font-bold text-rose-300">${errAvg(h)}</p></div>
      </div><div class="mt-3">${spark(G, h.slice(-30))}</div></div>`;
  }).join('')}</div>`;
}
$('#game').addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]')?.dataset.tab, mode = e.target.closest('[data-mode]')?.dataset.mode;
  if (tab) { stopGame(); cur.tab = tab; return renderGame() }
  if (mode) { cur.mode = mode; store.set(`bf-mode:${cur.G.id}`, mode); return renderGame() }
  if (e.target.closest('#gStart')) { cur.tab = 'play'; return startGame() }
});
$('#gClose').onclick = closeGame;
document.addEventListener('keydown', e => {
  if (!cur) return;
  if (e.key === 'Escape') return closeGame();
  cur.ctx?.key(e);
});

/* ================= PAGE ================= */
function renderText() {
  document.documentElement.lang = lang;
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  $$('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  const on = 'bg-white text-ink-950', off = 'text-zinc-400 hover:text-white';
  $$('[data-lang]').forEach(b => b.className = `px-2 min-[360px]:px-2.5 py-1.5 rounded-md transition ${b.dataset.lang === lang ? on : off}`);
  $('#statGames').textContent = GAMES.length;
  $('#statModes').textContent = GAMES.reduce((n, G) => n + G.modes.length, 0);
}
function renderCards() {
  $$('[data-cat]').forEach(box => box.innerHTML = GAMES.filter(G => G.cat === box.dataset.cat).map(G => {
    const m = modeKey(G.id), b = bestOf(G, m);
    return `<button data-open="${G.id}" class="group text-left rounded-2xl border border-white/10 bg-ink-900 p-5 hover:border-accent/50 transition flex flex-col">
      <div class="flex items-start justify-between gap-3">
        <span class="grid place-items-center w-11 h-11 rounded-xl bg-accent/10 text-accent group-hover:bg-accent group-hover:text-ink-950 transition"><i data-lucide="${G.icon}" class="w-5 h-5"></i></span>
        <span class="flex flex-wrap justify-end gap-1.5">${G.tags.map(tagHTML).join('')}</span>
      </div>
      <h3 class="mt-4 text-lg font-semibold text-white">${L(G.name)}</h3>
      <p class="mt-1 text-sm text-zinc-400 leading-relaxed">${L(G.short)}</p>
      <div class="mt-auto pt-4 flex items-center justify-between text-sm">
        <span class="text-zinc-500">${t('best')}: <b class="text-white">${b == null ? '—' : G.fmt(b)}</b></span>
        <span class="inline-flex items-center gap-1 font-semibold text-accent">${t('play')}<i data-lucide="chevron-right" class="w-4 h-4"></i></span>
      </div></button>`;
  }).join(''));
}
let warm = [];
function pickWarm() { warm = ['memory', 'speed', 'vision'].map(cat => { const g = GAMES.filter(G => G.cat === cat); return g[rnd(0, g.length - 1)].id }) }
function renderHero() {
  $('#statPlayed').textContent = totalPlayed();
  $('#warmList').innerHTML = warm.map((id, i) => {
    const G = GAME[id], b = bestOf(G, modeKey(id));
    return `<button data-open="${id}" class="w-full flex items-center gap-4 rounded-2xl border border-white/10 bg-ink-950 p-4 text-left hover:border-accent/50 transition">
      <span class="font-mono text-sm text-zinc-600">0${i + 1}</span>
      <span class="grid place-items-center w-10 h-10 shrink-0 rounded-xl bg-accent/10 text-accent"><i data-lucide="${G.icon}" class="w-5 h-5"></i></span>
      <span class="min-w-0 flex-1"><span class="block font-semibold text-white truncate">${L(G.name)}</span><span class="block text-xs text-zinc-500">${t('best')}: ${b == null ? '—' : G.fmt(b)}</span></span>
      <i data-lucide="play" class="w-4 h-4 text-accent"></i></button>`;
  }).join('');
}
function renderMethods() {
  $('#metGrid').innerHTML = METHODS.map(m => `<div class="rounded-2xl border border-white/10 bg-ink-900 p-5 flex flex-col">
    <div class="flex items-start justify-between gap-3">
      <span class="grid place-items-center w-10 h-10 shrink-0 rounded-xl bg-accent/10 text-accent"><i data-lucide="${m.icon}" class="w-5 h-5"></i></span>
      <span class="flex flex-wrap justify-end gap-1.5">${m.tags.map(tagHTML).join('')}</span>
    </div>
    <p class="mt-4 font-mono text-xs text-accent">${typeof m.era === 'string' ? m.era : L(m.era)}</p>
    <h3 class="mt-1 font-semibold text-white">${L(m.t)}</h3>
    <p class="mt-2 text-sm text-zinc-400 leading-relaxed">${L(m.d)}</p>
    <div class="mt-auto pt-4">${m.game ? `<button data-open="${m.game}" class="inline-flex items-center gap-1 text-sm font-semibold text-accent hover:text-white transition">${L(GAME[m.game].name)}<i data-lucide="chevron-right" class="w-4 h-4"></i></button>`
      : `<a href="${m.link}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-sm font-semibold text-accent hover:text-white transition">SumerFast<i data-lucide="external-link" class="w-4 h-4"></i></a>`}</div></div>`).join('');
  $('#tipsList').innerHTML = TIPS.map(([ic, s]) => `<li class="flex items-start gap-3"><span class="grid place-items-center w-8 h-8 shrink-0 rounded-lg bg-white/5 text-accent"><i data-lucide="${ic}" class="w-4 h-4"></i></span><span class="pt-1 text-sm text-zinc-300 leading-relaxed">${L(s)}</span></li>`).join('');
}
function renderStats() {
  $('#statsGrid').innerHTML = GAMES.map(G => `<button data-open="${G.id}" data-open-tab="stats" class="text-left rounded-2xl border border-white/10 bg-ink-900 p-5 hover:border-accent/50 transition">
    <div class="flex items-center gap-3"><i data-lucide="${G.icon}" class="w-4 h-4 text-accent"></i><span class="font-semibold text-white">${L(G.name)}</span></div>
    <div class="mt-3 space-y-1.5 text-sm">${G.modes.map(m => { const b = bestOf(G, m.k), n = hist(G.id, m.k).length; const le = n ? hist(G.id, m.k)[n - 1].e : null; return `<div class="flex justify-between gap-3"><span class="text-zinc-500">${L(m.name)}</span><span class="${n ? 'text-white font-semibold' : 'text-zinc-600'}">${n ? `${G.fmt(b)} <span class="text-xs font-normal text-zinc-500">· ${n}</span>${le != null ? ` <span class="text-xs font-normal text-rose-300">· ✕${le}</span>` : ''}` : t('statsEmpty')}</span></div>` }).join('')}</div>
  </button>`).join('');
}
function renderMore() {
  $('#moreGrid').innerHTML = SITES.map(x => `
    <a href="${x.url}" target="_blank" rel="noopener" class="group flex items-center gap-3 sm:gap-5 rounded-3xl border border-white/10 bg-ink-900 p-4 sm:p-6 hover:border-accent/50 hover:-translate-y-1 transition duration-300">
      <span class="grid place-items-center w-12 h-12 sm:w-16 sm:h-16 shrink-0 rounded-2xl bg-accent/10 text-2xl sm:text-3xl font-semibold text-accent" style="font-family:'Noto Sans Thai','Noto Sans Cuneiform',Inter,sans-serif">${x.glyph}</span>
      <span class="flex-1 min-w-0">
        <span class="flex items-center gap-1.5 text-sm font-bold text-white"><i data-lucide="zap" class="w-3.5 h-3.5 text-accent"></i><span>${x.name[0]}<span class="text-accent">${x.name[1]}</span></span></span>
        <span class="block mt-1 text-lg font-semibold text-white">${L(x.t)}</span>
        <span class="block mt-1 text-sm text-zinc-400 leading-relaxed">${L(x.d)}</span>
      </span>
      <i data-lucide="arrow-up-right" class="w-5 h-5 shrink-0 text-zinc-500 group-hover:text-accent transition"></i>
    </a>`).join('');
}
function navFill() {
  $('#navMenu > div').innerHTML = $$('header nav > div.lg\\:flex a').map(a => `<a href="${a.getAttribute('href')}" class="rounded-lg px-3 py-2.5 text-zinc-300 hover:bg-white/5 hover:text-white transition">${a.textContent}</a>`).join('');
}
function navToggle(open = $('#navMenu').classList.contains('hidden')) {
  $('#navMenu').classList.toggle('hidden', !open);
  $('#navBtn').setAttribute('aria-expanded', open);
  $$('#navBtn .nav-closed').forEach(i => i.classList.toggle('hidden', open));
  $$('#navBtn .nav-opened').forEach(i => i.classList.toggle('hidden', !open));
}
$('#navBtn').onclick = e => { e.stopPropagation(); navToggle() };
$('#navMenu').addEventListener('click', e => e.target.closest('a') && navToggle(false));
document.addEventListener('click', e => {
  if (!e.target.closest('header')) navToggle(false);
  const o = e.target.closest('[data-open]');
  if (o && !e.target.closest('#game')) openGame(o.dataset.open, o.dataset.openTab || 'play');
});
$('#warmShuffle').onclick = () => { pickWarm(); renderHero(); icons() };
$('#statsReset').onclick = () => {
  if (!confirm(t('statsConfirm'))) return;
  GAMES.forEach(G => G.modes.forEach(m => store.del(SK(G.id, m.k))));
  renderAll();
};

function renderAll() {
  renderText(); renderCards(); renderHero(); renderStarter(); renderModes(); renderMethods(); renderStats(); renderMore(); navFill();
  if (cur) renderGame();
  icons();
}
$$('[data-lang]').forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set('bf-lang', lang); stopGame(); renderAll() });

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .08 });
$$('.reveal').forEach(el => io.observe(el));
pickWarm();
renderAll();

/* ================= OFFLINE ================= */
// sw.js keeps the whole site (page, audio, libraries, fonts) for use without internet and, when online,
// downloads only what changed (offline.json, written by tools/offline.py on every commit)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const OFF = {
    ru: ['Сохраняем сайт для работы без интернета: {p}%', 'Сайт сохранён — работает и без интернета', 'Нет сети — открыта сохранённая версия'],
    en: ['Saving the site for offline use: {p}%', 'Saved — the site works without internet too', 'Offline — showing the saved version'],
    th: ['กำลังบันทึกเว็บไว้ใช้แบบออฟไลน์: {p}%', 'บันทึกแล้ว ใช้งานได้แม้ไม่มีอินเทอร์เน็ต', 'ไม่มีอินเทอร์เน็ต กำลังแสดงเวอร์ชันที่บันทึกไว้'],
  };
  const offSay = (i, p) => { const el = document.getElementById('offlineState'); if (el) el.textContent = (OFF[document.documentElement.lang] || OFF.en)[i].replace('{p}', p) };
  navigator.serviceWorker.addEventListener('message', e => {
    const d = e.data; if (!d || d.type !== 'offline') return;
    if (d.offline) offSay(2); else if (d.done < d.total) offSay(0, Math.floor(d.done / d.total * 100)); else offSay(1);
  });
  addEventListener('offline', () => offSay(2));
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready)
      .then(r => r.active && r.active.postMessage({ type: 'sync', full: !(navigator.connection && navigator.connection.saveData) }))
      .catch(() => {});
  });
}
</script>
</body>
</html>
